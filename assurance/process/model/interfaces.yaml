# Cross-domain interfaces. Format: assurance/process/README.md §3.
# An interface is a point where one discipline's analysis depends on another's. Each one is anchored to
# text that already exists in the work products: an anchor `WP-x-nn:text` must occur verbatim in that
# work product, so the model cannot claim a link the documents do not make.
# status: documented = both sides reference each other, not yet reviewed;
#         open = a recorded open item still has to settle it (named in open_item).

- id: IX-01
  kind: interface
  phase: G1
  between: [WP-C-03, WP-C-07]
  pattern: "Safety-Security"
  topic: "Threat scenarios that can cause a hazard are rated against the hazard list; cyber-induced hazards appear in the risk assessment"
  anchors: ["WP-C-03:Cyber-induced hazards are analysed in WP-C-07", "WP-C-07:Safety impact is anchored to the hazard list of WP-C-03"]
  status: documented
  open_item: null
  due: G1
- id: IX-02
