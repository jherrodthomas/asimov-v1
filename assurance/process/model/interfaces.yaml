  anchors: ["WP-C-04:The perception trigger of SF-06 and the limits of SF-02 are bounded in WP-C-10", "WP-C-10:What the camera and the IMU cannot see bounds the claim SF-06 and SF-02 can make"]
  status: documented
  open_item: null
  due: G1
