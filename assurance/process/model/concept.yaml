# Concept phase (gate G1). Format: assurance/process/README.md §3.
# Clause references are read from the WP-M-00 register row of each produced work product. `inputs` are
# the work products an activity needs before it can finish; iteration between activities is modelled
# as an interface (interfaces.yaml), not as an input.

- id: CON-01
  kind: activity
  phase: G1
  lane: joint
  name: "Define the robot and its limits"
  produces: [WP-C-01]
  inputs: [WP-M-01, WP-M-11]
- id: CON-02
  kind: activity
  phase: G1
  lane: risk
  name: "Specify the operating envelopes and tasks"
  produces: [WP-C-02]
  inputs: [WP-C-01]
- id: CON-03
  kind: activity
  phase: G1
  lane: risk
  name: "Analyse human-robot interaction, contact limits and foreseeable misuse"
  produces: [WP-C-06]
  inputs: [WP-C-01, WP-C-02]
- id: CON-04
  kind: activity
  phase: G1
  lane: risk
  name: "Hazard identification and risk assessment"
  produces: [WP-C-03]
  inputs: [WP-C-01, WP-C-02, WP-C-06]
- id: CON-05
  kind: activity
  phase: G1
  lane: srpcs
  name: "Specify the safety functions and their required PL"
  produces: [WP-C-04]
  inputs: [WP-C-03, WP-C-06]
- id: CON-06
  kind: activity
  phase: G1
  lane: risk
