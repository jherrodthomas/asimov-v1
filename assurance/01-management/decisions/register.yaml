- id: DQ-043
  ref: GAP-03
  question: "At what height does the tether catch the robot when its feet are on the floor: knee height (about 0.4 m), hip height, or the floor itself with a slack tether?"
  context: >-
    With the feet on the floor the tether must let the robot stand and move but stop it before it hits the floor or
    a person. A catch at knee height keeps the fall short and the energy small but gives the tether a shock on every
    loss of balance; a catch at hip height stops nothing a kneel would not; a slack tether to the floor lets the
    controlled descent (DQ-005 A) do its work but lets a failed descent reach the floor. The value sets the tether
    length in every session and the loads the gantry must take.
  reversibility: easy
  decider: lead
  blocks: "WP-V-07 §3 feet-on-the-floor row; WP-V-02 §2; WP-S-04 fall-arrest budget; the gantry rating of DQ-035"
  gate: G1
  asked: 2026-10-21
  batch: 4
  proceed_after: 2026-11-04
  options:
    - key: A
      recommended: true
      title: "Knee height, about 0.4 m from the floor at the centre of mass, until the controlled descent is verified; then re-decided for the descent tests"
      detail: "Short fall, bounded energy, no floor contact. Cost: the descent cannot complete below the catch, so the descent tests need their own setting (WP-V-02)."
    - key: B
      title: "Slack to the floor: the tether catches only a fall faster than the descent"
      detail: "Lets the descent be tested as designed. Cost: a failed descent reaches the floor; the tether must be set per test by someone who knows the descent's path."
  sources: ["WP-V-07 §3", "WP-V-02 (skeleton)", "DQ-005, DQ-024 (decided)", "WP-S-04 §2"]
  status: applied
  answer: {choice: A, via: inbox, at: 2026-10-21}
  applied: {ref: "asimov-v1 claude/happy-sagan-hl6agy", record: "WP-V-07 v0.5 §3 (tether catch at knee height, about 0.4 m at the centre of mass, until the controlled descent is verified); WP-V-02 §2; WP-S-04 §2", at: 2026-10-21}

- id: DQ-044
  ref: GAP-00
  question: "Where is the laboratory: your own premises under your own rules, or a shared or institutional space with its own safety officer and permit system?"
  context: >-
    Every operating limit, the two-person rule and the equipment purchase assume a room: level sealed floor, a
    gantry on castors, a cleared rectangle with two stations, power for a bench supply, and somewhere the robot and
    the gantry stay between sessions. Your own premises give control and no permit; an institutional space brings a
    safety officer who will read this record, a permit process, insurance, and often a ban on home-built lifting
    equipment, which affects the gantry choice. The record names no site and the test-sites folder is empty.
  reversibility: revisit
  decider: lead
  blocks: "06-validation/test-sites/ (the first site record); WP-C-02 §6; WP-V-07 condition C-4; WP-M-02 §3.1 roles"
  gate: G1
  asked: 2026-10-21
  batch: 4
  options:
    - key: A
      recommended: true
      title: "Your own premises, recorded as the first test site with a sketch, dimensions, floor and power, and the record as its own safety rule"
      detail: "No permit, no third party; the record is the rule. Cost: you are the safety officer of your own laboratory; insurance for a 35 kg machine on a gantry is yours to check."
    - key: B
      title: "An institutional or shared laboratory under its safety officer and permit system"
      detail: "A second pair of eyes and often a rated anchor point. Cost: a permit application that reads this record, their rules on lifting gear and visitors, and scheduling."
    - key: C
      title: "Undecided; no site until the equipment is bought"
      detail: "No commitment. Cost: the gantry choice, the floor assumption and the two-person rule all depend on the room."
  sources: ["WP-C-02 §6", "06-validation/test-sites/README.md (empty)", "WP-V-07 §2 C-4", "DQ-022, DQ-027 (decided)"]
