      title: "Hold G1 after the first hang test: the measured mass, centre of gravity and fall data are entered into WP-C-01, WP-C-03 and WP-S-04 first"
      detail: "The concept is closed on measured numbers. Cost: G1 waits for the gantry, the second person and an assembled robot; the record keeps working in P1 meanwhile."
    - key: B
      title: "Hold G1 on the record alone, with the measurements as conditions carried into P2"
