- id: DQ-031
  ref: GAP-00
  question: "Are the kit-assembly hazards (MJF nylon dust, two-person lifting of 35 kg, ESD during board handling) inside the first item, or out of scope as the builder's workshop safety?"
  context: >-
    The concept-phase package lists hazards that arise before the robot is a machine at all: post-processing the
    printed parts (H-17), lifting the assembled robot (H-18), handling the boards (H-10). Each has a procedural
    measure (SF-12, SF-17, SF-18) and no Performance Level. In the EU frame the machine's risk assessment covers
    the machine in use; assembly by the buyer is the buyer's workplace. Keeping them in the item means writing and
    reviewing the procedures; dropping them means the information for use says so and nothing more.
  reversibility: easy
