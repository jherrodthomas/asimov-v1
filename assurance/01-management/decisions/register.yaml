- id: DQ-041
  ref: GAP-03
  question: "Do we accept the hazards the tether itself introduces (a snag on a limb, a swing into the operator, a tether or shackle failure) with the rigging checks and the cleared area as the measures?"
  context: >-
    The gantry and tether remove the fall onto the floor (DQ-007 A) and bring hazards of their own: a tether that
    snags a joint and tears a harness, a 35 kg body that swings into the operator when caught, a shackle that opens.
    The risk assessment lists this as a new hazard to be rated; the measures on offer are the pre-session rigging
    checks, the quick-release, a tether route that stays above the shoulders, and the cleared area that keeps both
    people outside the swing radius. None is a function with a PL; all are rules and inspections you accept.
  reversibility: revisit
  decider: lead
  blocks: "WP-C-03 §8 and WP-C-05 §3.3; WP-V-07 §2 C-1 and §4; the tether specification of DQ-035"
  gate: G1
  asked: 2026-10-21
  batch: 4
  options:
    - key: A
      recommended: true
      title: "Accept for OE-1 with the rigging checks, a tether route above the shoulders, the quick-release and a swing radius added to the cleared area"
      detail: "The tether's hazards are smaller than the fall it removes. Cost: a larger cleared area (the tether length added to the reach envelope) and a rigging check before every session."
    - key: B
      title: "Do not accept until a second, independent catch (a safety net or a second tether) exists"
      detail: "Belt and braces. Cost: more rigging, more snag points, and the first hang test waits again."
  sources: ["WP-C-03 §8 (tether integrity)", "WP-V-07 §2 C-1, §4", "DQ-007, DQ-027 (decided)", "ISO 12100:2010 §5.4 (hazards introduced by measures), to be checked"]
