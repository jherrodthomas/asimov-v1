      detail: "Matches what the laboratory relies on. Cost: the wireless device earns no credit in the OE-1 case; it must be re-rated before OE-2."
    - key: B
      title: "A stop demand everywhere: loss of either device's integrity ends the session in a controlled descent"
      detail: "Strictest. Cost: nuisance descents from a consumer radio; the test campaign slows and the tether takes more loads."
