- id: DQ-042
  ref: GAP-25
  question: "Do we adopt a stator temperature cut-off of 60 °C with a thermal readout logged every ten minutes as the laboratory session limit, until the actuators' own thermistor limits are known?"
  context: >-
    The actuators' thermal limits are not published and no thermistor cut-off is documented (GAP-25); an
    over-temperature stator is a fire and a loss of torque mid-stand (H-12). The hold point proposes 60 °C and a
    ten-minute readout as placeholders. A lower cut-off shortens sessions; a higher one trusts figures the record
    does not have. The over-temperature shutdown SF-14 at PL c will replace the rule once the firmware reads the
    thermistors.
  reversibility: easy
  decider: lead
  blocks: "WP-V-07 §3 session length; WP-C-04 SF-14 threshold; WP-W-09 PAR-nn; WP-C-01 §4 duty limits"
  gate: G1
  asked: 2026-10-21
  batch: 4
  proceed_after: 2026-11-04
  options:
    - key: A
      recommended: true
      title: "60 °C and a readout every ten minutes until the actuator data sheet or a measurement gives a better figure; sessions end at the cut-off"
      detail: "Conservative for a motor stator, cheap to check. Cost: short sessions on a warm day; a thermometer or the actuators' own readout must exist."
    - key: B
      title: "80 °C, closer to a typical winding limit"
      detail: "Longer sessions. Cost: no data for these actuators; a thermal runaway starts from a warm stator."
  sources: ["WP-V-07 §3", "WP-C-03 H-12", "gap assessment GAP-25", "WP-C-04 SF-14"]
  status: applied
