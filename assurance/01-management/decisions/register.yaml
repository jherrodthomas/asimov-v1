- id: DQ-033
  ref: GAP-20
  question: "Is the UART debug port of the motion control board physically disabled in the laboratory build, protected by a password and a cover, or left open for development?"
  context: >-
    The board exposes a UART debug port with no documented protection (GAP-20). Anyone with physical access can
    read and change the firmware and its parameters, including the clamps and the watchdog you set at PL d, without
    touching the tele-operation link. In a supervised laboratory physical access is yours; the question is what the
    reference build looks like and what the cybersecurity requirements (WP-C-08) demand. The security level you set
    (DQ-012 A, SL 2) expects protection against a deliberate attacker with simple means.
  reversibility: easy
  decider: lead
  blocks: "WP-C-08 §3 CSR on the debug port; WP-H-02 board changes; WP-W-01 development environment; WP-O-02 maintenance access"
