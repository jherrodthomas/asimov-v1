    The first item is the kit robot tethered under a gantry, tele-operated (DQ-003 A). Walking needs a balance
    controller or the unreleased policy; neither exists in public, and you decided balance is not a safety
    function (DQ-006 A). If walking stays in the item, the gantry needs a span, the tests of WP-V-02 need a walking
    campaign and the fall-arrest budget needs the walking case. If it does not, the first item is a standing
    machine and the walking case moves to the second item with the policy.
