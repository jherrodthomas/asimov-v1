- id: DQ-035
  ref: GAP-03
  question: "Do we approve the bench equipment purchase: a 500 kg-class portable gantry crane with trolley, a rated winch or fall-arrest block, tether and shackles, a dual-channel E-stop pendant with a safety relay and two contactors, and a current-limited bench supply?"
  context: >-
    You chose to buy a rated gantry (DQ-027 A), a wired pendant through contactors (DQ-008 A) and a bench supply in
    place of a battery (DQ-009 A). Together they are the hold point's conditions C-1 to C-3 and the first money the
    record asks for. A portable aluminium gantry crane with a trolley is typically in the low thousands; a rated
    winch or self-retracting block in the hundreds; a certified safety relay with two contactors and a pendant a
    few hundred; a 48 V current-limited supply a few hundred. Nothing is powered with the robot assembled until all
    of it exists; a cheaper substitute for any one item loses the rating the argument rests on.
  reversibility: easy
