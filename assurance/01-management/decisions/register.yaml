- id: DQ-034
  ref: GAP-09
  question: "Does the fork add a second, independent IMU for the plausibility check SF-23, or does the second channel come from the actuators' encoders and current read-back?"
  context: >-
    You set the IMU plausibility check and the controlled descent at PL d (DQ-004 A), which needs single-fault
    tolerance (Category 3) in the detection of a fall. The board carries one IMU; a stuck or drifting IMU is then a
    single fault that defeats SF-02 and SF-23 together (DFMEA FM-12). A second IMU is a small board and a wiring
    change the DFMEA already asks for; using the leg encoders as the second channel costs no hardware but needs a
    kinematic estimate in firmware and gives a slower, less direct signal.
  reversibility: revisit
  decider: lead
  blocks: "WP-S-03 §3 architecture of SF-02 and SF-23; WP-H-02 board design; WP-H-04 DC figures; WP-W-03 §2"
  gate: G2
  asked: 2026-10-21
  batch: 3
  options:
    - key: A
      recommended: true
      title: "A second IMU of a different type on a separate supply, read by the safety layer and cross-checked against the first"
      detail: "Two diverse channels for the fall detection, the pattern the DFMEA asks for. Cost: a sensor board, a connector and a firmware driver; a board revision or a daughter board."
    - key: B
      title: "Encoder and current read-back from the leg actuators as the second channel, no new hardware"
      detail: "No hardware change. Cost: a kinematic estimate of the body attitude in firmware that must itself be verified; the two channels share the CAN bus and the board."
    - key: C
      title: "One IMU with self-test and rate limits; accept Category 2 for SF-23"
      detail: "Simplest. Cost: Category 2 cannot reach PL d; SF-23 would drop to PL c and the fall detection would rest on it."
  sources: ["DFMEA FM-12", "WP-C-04 SF-23 (second IMU for the second channel)", "ISO 13849-1:2023 §6 (designated architectures), to be checked", "electrical/README.md (LSM6DSV IMU)"]
