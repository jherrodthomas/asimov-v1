    Three inputs are measurements, not analysis: the mass, the centre of gravity and the fall energy (GAP-03), which
    the fall-arrest budget and the PL argument rest on. They need the robot assembled and hung, which needs the
    gantry (DQ-027) and a second person (DQ-022). Holding G1 before them means passing with those as conditions;
    holding it after means the concept phase waits on hardware.
