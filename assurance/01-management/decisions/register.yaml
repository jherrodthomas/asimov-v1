- id: DQ-028
  ref: GAP-05
  question: "Do we adopt the ISO/TS 15066 body-region limits for transient and quasi-static contact as the design targets for the clamps and the contact functions, or set lower project limits?"
  context: >-
    No contact limit is declared for the robot (GAP-05). The clamps you set at PL d (SF-03), the collaborative
    functions (SF-04, SF-20) and the tests of WP-V-03 all need a number per body region: how much force and
    pressure a limb may apply to a person, for how long. ISO/TS 15066 Annex A gives a table per body region that
    industrial collaborative robots use; it is written for arms, not for a 35 kg biped whose whole mass can be
    behind a contact. A lower project limit is safer and harder to meet; a higher one is not defensible.
  reversibility: revisit
  decider: lead
  blocks: "WP-C-06 §3 contact limits; WP-C-04 SF-03, SF-04, SF-20; WP-W-09 PAR-nn; WP-V-03 pass criteria"
  gate: G1
  asked: 2026-10-21
  batch: 3
  options:
    - key: A
      recommended: true
      title: "ISO/TS 15066 Annex A values as the design targets, with the head and neck region excluded from any contact by design (no reach into it), and a project factor of 0.75 on the arm and hand values until measured"
      detail: "A recognised table, made conservative where the biped's mass matters. Cost: the clamps must be set per joint from these numbers (WP-S-04), and the first measured contact may show the factor is not enough."
    - key: B
      title: "ISO/TS 15066 values as published, no factor"
      detail: "What a collaborative arm would use. Cost: written for arms with limited mass behind them; an assessor may ask why a 35 kg body gets the same number."
    - key: C
      title: "Project limits at half the ISO/TS 15066 values"
      detail: "Safest. Cost: the robot may not be able to stand or move usefully within them; every limit becomes a demonstration constraint."
  sources: ["ISO/TS 15066:2016 Annex A (to be checked)", "ISO 13482:2014 §5.7", "WP-C-03 H-02, H-04, H-24", "concept package 02_SyRS SYRS-006"]
  status: applied
  answer: {choice: A, via: inbox, at: 2026-10-21}
  applied: {ref: "asimov-v1 claude/happy-sagan-hl6agy", record: "WP-C-06 §3 (ISO/TS 15066 Annex A values as design targets, head and neck excluded from contact by design, a factor of 0.75 on the arm and hand values until measured); WP-C-04 SF-04, SF-20; WP-W-09 §2; WP-V-03 §2", at: 2026-10-21}

- id: DQ-029
  ref: GAP-00
  question: "Do we recruit a second contributor now as verification reviewer at independence I1, so that work products can leave Draft, or wait until there is hardware to show?"
  context: >-
    You approve your own work for now (DQ-011 A) and no assessor is engaged (DQ-010 A). The one thing that moves a
    work product from Draft to Approved under the plan is a verification review by someone other than its author
    (WP-P-05), at I1; that person need not be an expert assessor, only competent and not the author. Without one,
    nothing in the record changes status before G1, and the G0 condition on the verification reviewer role stays
    open. Recruiting means a public call, a named person and a few hours of their time per work product.
  reversibility: easy
