- id: DQ-036
  ref: GAP-07
  question: "Does the E-stop chain use a certified safety relay module with monitored reset, or two plain relays wired by hand?"
  context: >-
    The wired pendant you chose (DQ-008 A) has two contacts; something has to turn two contacts into a monitored,
    single-fault-tolerant removal of the actuator rail that latches and re-arms only on purpose. A certified safety
    relay module (Category 3 or 4 per its data sheet, with cross-monitoring and a reset input) does that out of the
    box and brings a certificate the PL d argument can cite. Two plain relays can be wired to the same effect but
    carry no certificate, no fault list and no MTTFD figure; the record would have to produce them.
  reversibility: revisit
