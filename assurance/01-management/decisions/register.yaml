- id: DQ-045
  ref: GAP-00
  question: "How many hours per week does the project get from you, so the project plan can put dates on the gates?"
  context: >-
    Every schedule line in the project plan (WP-M-03) is empty because the one resource is undefined. The concept
    phase, the fork's minimal firmware (DQ-023 A), the bench equipment and the first hang test are all your hours;
    the reviewer you are recruiting (DQ-029 A) adds a few per document. A number, even a rough one, turns the gate
    roadmap from a list into dates and tells the record what is realistic to promise before G1.
  reversibility: easy
  decider: lead
  blocks: "WP-M-03 §4 and §5 (effort, schedule, gate dates); WP-M-07 schedule risk"
  gate: G1
  asked: 2026-10-21
  batch: 5
  proceed_after: 2026-11-04
  options:
