  options:
    - key: A
      recommended: true
      title: "Recruit now: a public call in the repository and the upstream community for one reviewer with machinery-safety or robotics experience, starting with WP-C-03 and WP-C-04"
      detail: "The two documents that matter most get a second pair of eyes before anything is built. Cost: your time to find and brief someone; the record's conventions must be readable by an outsider, which they are meant to be."
    - key: B
      title: "Wait until the first hang test, then recruit with something to show"
