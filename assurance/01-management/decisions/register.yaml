- id: DQ-046
  ref: GAP-00
  question: "Where is the call for a verification reviewer posted beyond this repository: the upstream community channels, a robotics or functional-safety forum, or nowhere else?"
  context: >-
    You decided to look for a reviewer now (DQ-029 A) and the call is written in CONTRIBUTING.md. Nobody reads a
    fork's contributing page unprompted. Upstream's Discord, forum and X account reach the people who own the same
    kit; a functional-safety or robotics forum reaches people who can review a risk assessment; either is a public
    post in your name. The record cannot post on your behalf, so this fixes what you do, not what I do.
  reversibility: easy
  decider: lead
  blocks: "Whether the reviewer role (G0 condition C-2) can be filled before G1; WP-M-02 §3.1"
  gate: G1
  asked: 2026-10-21
  batch: 5
  options:
    - key: A
      recommended: true
      title: "Upstream's Discord and forum, with a link to the contributing page and the two documents to review"
      detail: "Reaches builders of the same robot, who can also catch mistakes about the hardware. Cost: a public post in the upstream community about a fork that assesses their design; wording that makes clear it is independent of upstream."
    - key: B
      title: "A functional-safety or robotics-safety forum or mailing list"
      detail: "Reaches reviewers with the right training. Cost: they do not know the robot; a longer briefing."
    - key: C
      title: "Both"
      detail: "Widest reach. Cost: two posts to write and answer."
    - key: D
      title: "Nowhere else; wait for someone to find the repository"
      detail: "No posting. Cost: the role most likely stays unfilled through G1."
