- id: DQ-040
  ref: GAP-27
  question: "Is every powered session recorded, with telemetry and video kept as evidence, and for how long?"
  context: >-
    The validation tests, the fall campaign and every anomaly need evidence: joint commands and states, IMU data,
    E-stop events, the operator's camera view and a room camera. A recording is also what shows an assessor what
    happened in a session and what lets a fall be analysed. Keeping video of people in the laboratory is personal
    data; keeping it forever is a storage and privacy cost; keeping too little loses the one event that mattered.
    The package's quality gaps include records of test and nonconformance not maintained (GAP-27).
  reversibility: easy
  decider: lead
  blocks: "WP-V-07 §5 test log; WP-P-01 records; WP-O-04 field monitoring; WP-M-05 records control"
  gate: G1
  asked: 2026-10-21
  batch: 4
  proceed_after: 2026-11-04
  options:
    - key: A
      recommended: true
      title: "Every powered session: telemetry logged to the session record and kept with the record; room video kept for the campaign plus one gate, then deleted unless an anomaly refers to it"
      detail: "Evidence where it matters, bounded retention. Cost: storage for the telemetry, a camera, and a line in the information for use that sessions are recorded."
    - key: B
      title: "Telemetry only, no video"
      detail: "No personal data. Cost: a fall or a contact cannot be reconstructed from joint data alone."
    - key: C
      title: "Record only the tests of WP-V-01…V-05, not every session"
      detail: "Less data. Cost: the anomaly that happens in an ordinary session has no record."
  sources: ["WP-V-07 §5", "gap assessment GAP-27", "WP-O-04 (skeleton)", "ISO 13849-2:2012 §4 (validation records), to be checked"]
