- id: DQ-047
  ref: GAP-14
  question: "Do we ask upstream, in public, for the actuator and encoder failure-rate data, the E-stop design and the mode-machine specification, or wait for them to publish?"
  context: >-
    The PL calculation needs MTTFD, DC and CCF inputs that upstream does not publish (GAP-14); the stop chain
    design needs to know what the kit's wireless E-stop and receiver are (GAP-07); the safety layer needs the
    mode-machine behaviour the manual only describes. The gap assessment's action 8 is to ask. A public issue or
    discussion on the upstream repository is a courteous, visible request that also tells upstream the fork exists;
    their silence or answer both become design inputs the record can cite.
  reversibility: easy
  decider: lead
  blocks: "WP-H-04 §2 reliability data; WP-H-02 §3 E-stop design; WP-M-10 upstream management; the gap assessment's action 8"
  gate: G2
  asked: 2026-10-21
  batch: 5
  proceed_after: 2026-11-04
  options:
    - key: A
      recommended: true
      title: "One public discussion on the upstream repository, drafted in the record first (WP-M-10), asking for the three things and offering the fork's findings in return"
      detail: "Visible, polite, citable. Cost: a drafted text for you to post; upstream may decline or not answer, which the record then states."
    - key: B
      title: "A private message to Asimov Inc"
      detail: "Less public. Cost: an answer the record cannot cite without permission; the fork stays unknown to the community."
    - key: C
      title: "Do not ask; substitute certified components and the fork's own measurements"
      detail: "Independent of upstream. Cost: the actuators cannot be substituted; their failure rates would be estimated from generic data, which an assessor will discount."
  sources: ["gap assessment GAP-07, GAP-14 and action 8", "WP-M-10 (skeleton)", "WP-H-04 (skeleton)", "CLAUDE.md (upstream is quoted, not restated)"]
  status: open

- id: DQ-048
  ref: GAP-07
  question: "After an emergency stop, is the robot re-armed only from the pendant's reset with the button released, or also from the operator app?"
  context: >-
    A stop that can be cleared from software is a stop that software can clear by mistake; ISO 13850 expects a
    deliberate manual reset at the device before anything can restart, and a separate start command. The pendant
    you chose (DQ-008 A) can carry a reset button; the operator app is a network client (SL 2, DQ-012 A). Re-arming
    only at the pendant means walking to it after every stop, which in the laboratory is the operator's own hand.
  reversibility: easy
  decider: lead
  blocks: "WP-C-04 SF-13 reset; WP-S-03 §4; WP-S-05 safety chain I/O; WP-V-04 test cases"
  gate: G2
  asked: 2026-10-21
  batch: 5
  proceed_after: 2026-11-04
  options:
    - key: A
      recommended: true
      title: "Pendant reset only, with the button released, then a separate start command from the operator app; the app can never re-arm"
      detail: "What ISO 13850 and the safety relay's own reset input expect. Cost: nothing in the laboratory; in a later envelope the pendant must be where the person who re-arms stands."
    - key: B
      title: "Reset from either the pendant or the app"
      detail: "Convenient. Cost: a network client in the re-arm path of a PL d chain; the safety relay's monitored reset is bypassed."
  sources: ["ISO 13850:2015 §4.1.4 (reset), to be checked", "WP-C-04 SF-13", "DQ-008, DQ-012, DQ-036 (decided)"]
  status: open

- id: DQ-049
  ref: GAP-06
  question: "Is the laboratory joint velocity ceiling set at 1.0 rad/s for every joint until the fall-arrest budget replaces it?"
  context: >-
    You set the torque limit at half the MuJoCo range (DQ-014 A) and left the velocity ceiling to the fall-arrest
    budget (WP-S-04), which does not exist yet. The hold point and the first firmware need a number now. 1.0 rad/s
    is slow enough that a limb sweep at the shoulder moves the hand at under 1 m/s and fast enough to stand and step
    in place; it is a placeholder a measurement will replace, which is why this is a reversible technical choice.
  reversibility: easy
  decider: claude
  blocks: "WP-W-09 PAR-nn; WP-V-07 condition C-5; WP-C-04 SF-03"
  gate: G1
  asked: 2026-10-21
  batch: 5
  proceed_after: 2026-10-28
  options:
    - key: A
      recommended: true
      title: "1.0 rad/s on every joint in OE-1 until WP-S-04 sets a per-joint value"
      detail: "Simple, conservative, enough to stand. Cost: stepping in place may feel slow; the value is replaced at G2."
    - key: B
      title: "2.0 rad/s"
      detail: "Livelier motion. Cost: a hand speed near 2 m/s at the shoulder, above what ISO/TS 15066 contemplates for transient contact."
  sources: ["DQ-014 (decided)", "WP-V-07 §2 C-5", "sim-model/xmls/asimov.xml (joint ranges)", "ISO/TS 15066:2016 (speed and contact), to be checked"]
  status: open

- id: DQ-050
  ref: GAP-17
  question: "Does the fork ask upstream for the locomotion policy's weights and training description under an agreement, or treat the policy as a black box it never sees?"
  context: >-
    You withdrew balance as a safety function (DQ-006 A), so the policy is a functional component whose commands
    the safety layer bounds. Even so, the insufficiency analysis (WP-C-10), the ML plan and the second item need to
    know what the policy was trained on and how it behaves at the edges (GAP-17, GAP-21). Weights under an agreement
    would let the fork test the policy in the MuJoCo model; a black box means every statement about it stays a
    claim to verify on the real robot, later, on the tether.
  reversibility: easy
  decider: lead
  blocks: "WP-C-09 §3; WP-C-10 §2; WP-M-09 §3; WP-W-10 scope"
  gate: G2
  asked: 2026-10-21
  batch: 5
  options:
    - key: A
      recommended: true
      title: "Black box for the first item: no request; the record states what the policy must satisfy at its interface and tests it on the tether when it is public"
      detail: "No dependency on upstream's goodwill, no agreement to negotiate. Cost: no simulation evidence about the policy; the second item inherits the question."
    - key: B
      title: "Ask upstream for the weights and training description under a non-disclosure agreement"
      detail: "Simulation evidence becomes possible. Cost: an agreement a one-person project has to negotiate and honour; findings under it cannot be published in the record."
  sources: ["DQ-006 (decided)", "gap assessment GAP-17, GAP-21", "WP-C-09 (skeleton)", "WP-M-09 (skeleton)"]
  status: open

- id: DQ-051
  ref: GAP-27
  question: "Are safety anomalies, test results and test videos published in the repository as they happen, or kept private until a gate review?"
  context: >-
    The record is public and publishes its own counter-evidence; the session recordings you approved (DQ-040 A)
    will show falls, failures and people. Publishing anomalies as they happen is the open-record principle the
    README states and lets reviewers see the raw evidence; it also shows the robot failing, with the lab and the
    people in it, before anyone has analysed why. Keeping them until a gate review trades openness for a considered
    account. Video of people needs their consent either way.
  reversibility: easy
  decider: lead
  blocks: "WP-P-04 documentation management; WP-O-04 field monitoring; WP-V-07 §6; the test-sites folder"
  gate: G1
  asked: 2026-10-21
  batch: 5
  options:
    - key: A
      recommended: true
      title: "Anomaly reports, logs and results published as issues and records as they happen; video published only when an anomaly report cites it and the people in it have agreed"
      detail: "The open record, with video behind consent. Cost: the repository shows every failure in near real time; wording that says a failure under test is the point of testing."
    - key: B
      title: "Everything held until the next gate review, then published with the gate record"
      detail: "A considered account. Cost: weeks of silence after a fall; reviewers see only what the gate record selects."
    - key: C
      title: "Logs and results public; no video ever"
      detail: "No faces, no consent questions. Cost: the one record that shows what a fall looked like stays private."
  sources: ["README (the project publishes its own counter-evidence)", "WP-V-07 §6 (anomalies)", "DQ-040 (decided)", "WP-O-04 (skeleton)"]
  status: open

- id: DQ-052
  ref: GAP-00
  question: "Who may be the observer in a powered test: any briefed adult, or only a person trained as a test operator?"
  context: >-
    You made two people mandatory for every powered test (DQ-022 A). The observer's job is to watch the robot and
    the operator, stay at the station outside the area, press the wireless E-stop if fitted, and call a halt. If only
    trained operators qualify, the first hang test waits for a second trained person; if any briefed adult qualifies,
    a household member or colleague with a ten-minute briefing and a signed line in the log can fill the role, which
    is what laboratories commonly accept for an observer who does not touch the equipment.
  reversibility: easy
  decider: lead
  blocks: "WP-V-07 §2 C-8; WP-M-04 competence requirements; WP-O-02 operating rules"
  gate: G1
  asked: 2026-10-21
  batch: 5
  proceed_after: 2026-11-04
  options:
    - key: A
      recommended: true
      title: "Any briefed adult: the briefing of WP-V-07 read aloud, the stations and the E-stop shown, a signed line in the log; the observer never enters the area or touches the robot"
      detail: "The first hang test can happen with the people you have. Cost: the observer's only tool is their voice and the wireless E-stop; the competence record (WP-M-04) must define the briefing."
    - key: B
      title: "A trained test operator only"
      detail: "Two competent people at every test. Cost: no powered test until a second person is trained, which is months."
  sources: ["DQ-022 (decided)", "WP-V-07 §2 C-8 and §4", "WP-M-04 (skeleton)", "WP-C-03 DM-04"]
  status: open

- id: DQ-053
  ref: GAP-00
  question: "Do powered tests on your own premises go ahead without specific liability insurance for the robot, or does cover come first?"
  context: >-
    You chose your own premises as the laboratory (DQ-044 A). A 35 kg machine on a gantry that can fall, swing or
    pinch is a liability your household or business policy may exclude as machinery under test; a visitor-observer
    (DQ-052) is the person most likely to be hurt. Cover is a cost and a conversation with an insurer who will ask
    what the record says; going ahead without it is a risk you carry personally. The record cannot decide this, only
    note what you decided and why.
  reversibility: easy
  decider: lead
  blocks: "WP-V-07 condition C-4 (the site); the first site record; WP-M-07 project risk register"
  gate: G1
  asked: 2026-10-21
  batch: 5
  options:
    - key: A
      recommended: true
      title: "Check the existing policy first; go ahead with hang tests (feet off the floor, observer outside the area) under it if machinery under test is not excluded, and obtain cover before the first floor test"
      detail: "The low-energy tests start; the floor tests, where the hazards are, wait for cover. Cost: one call to the insurer and a written answer filed with the site record."
    - key: B
      title: "Cover before any powered test"
      detail: "Clean. Cost: a quote for a one-off research robot takes time and may be refused; every test waits."
    - key: C
      title: "No specific cover; accept the risk personally and record it"
      detail: "Nothing to arrange. Cost: a fall onto a visitor-observer is uninsured; the record carries a personal risk acceptance an assessor will remark on."
  sources: ["DQ-044, DQ-052 (decided or open)", "WP-V-07 §2", "WP-M-07 (skeleton)"]
  status: open

- id: DQ-054
  ref: GAP-00
  question: "When does the second item (OE-2, the industrial cell with the battery and the policy) start: after the first item's release gate, or in parallel once upstream publishes the firmware and policy?"
  context: >-
    The first item is the tethered laboratory robot (DQ-002 A, DQ-003 A). OE-2 needs the firmware, the policy, the
    battery interlock, power-and-force limiting and a Category 3 chain, none of which exist, and twelve package gaps
    to close. Starting it in parallel when upstream publishes splits one person's hours and reopens the risk
    assessment while the first case is still being argued; starting it after G5 means the first item's evidence
    (firmware, chain, tests) is reused rather than duplicated.
  reversibility: revisit
  decider: lead
  blocks: "WP-M-03 §2 scope and §5 roadmap; WP-M-01 §7; the second item's register entries"
  gate: G2
  asked: 2026-10-21
  batch: 5
  options:
    - key: A
      recommended: true
      title: "After the first item's release gate G5; until then OE-2 appears only as the interface assumptions the first case states"
      detail: "One item at a time with one person. Cost: the walking, battery and collaborative claims are years out; upstream's firmware, when it arrives, is assessed inside the first item's scope only."
    - key: B
      title: "In parallel from the moment upstream publishes the firmware and policy"
      detail: "Follows upstream's pace. Cost: the hours are split, the risk assessment is re-rated for OE-2 mid-phase, and the first case slows."
  sources: ["DQ-002, DQ-003, DQ-032 (decided)", "WP-C-02 §2 OE-2", "WP-M-01 §7", "concept package 12_Gaps (12 gaps for OE-2)"]
  status: open

- id: DQ-017
  ref: GAP-33
  question: "Does the assurance record live inside the fork repository beside the CAD, electrical and simulation files, under assurance/?"
  reversibility: easy
  decider: claude
  blocks: "Where every path in the record points"
  gate: G0
  asked: 2026-10-21
  proceed_after: 2026-10-21
  context: >-
    The OpenAMRobot record is a separate repository beside the code forks; LionDriver keeps its record inside the
    fork. Asimov v1 is one repository holding the hardware record, so the assurance tree sits beside it and the
    safety-relevant file list can name the CAD and electrical paths directly.
  options:
    - key: A
      recommended: true
      title: "Inside the fork, under assurance/, with docs/, tools/ and wiki/ beside it"
      detail: "One repository, one CI, direct paths. Cost: the repository mixes large CAD files with the record."
    - key: B
      title: "A separate asimov-assurance repository"
      detail: "Keeps the record light. Cost: cross-repository paths and a second CI."
  sources: ["LionDriver layout", "openamrobot-assurance layout"]
  status: assumed
  answer: {choice: A, via: assumed, at: 2026-10-21}

- id: DQ-018
  ref: GAP-33
  question: "Do the hazard identifiers H-01 to H-32 follow the order of the concept-package hazard catalogue, keeping the HZ-ids as a cross-reference?"
  reversibility: easy
  decider: claude
  blocks: "trace/items/hazards.yaml; WP-C-03 §4"
  gate: G1
  asked: 2026-10-21
  proceed_after: 2026-10-21
  context: >-
    The package numbers hazards by category (HZ-M01, HZ-E01, …). The record's convention is one sequence H-nn
    never reused. Keeping the package order makes the port reviewable row by row.
  options:
    - key: A
      recommended: true
      title: "H-01 to H-32 in package order, HZ-id kept in the trace record"
      detail: "Reviewable. Cost: none."
    - key: B
      title: "Renumber by severity"
      detail: "Reads better. Cost: every package cross-reference has to be looked up."
  sources: ["concept package 06_Hazards"]
  status: assumed
  answer: {choice: A, via: assumed, at: 2026-10-21}

- id: DQ-019
  ref: GAP-33
  question: "Does the concept-phase package move from the repository root into assurance/00-assessment/concept-package/ as seed material?"
  reversibility: easy
  decider: claude
  blocks: "The README front page; the gap assessment's baseline"
  gate: G0
  asked: 2026-10-21
  proceed_after: 2026-10-21
  context: >-
    The workbooks, documents and figures of the package sat at the repository root. The record treats them as
    inherited, unreviewed seed material, which is what 00-assessment holds.
  options:
    - key: A
      recommended: true
      title: "Move the package to 00-assessment/concept-package/, keep its README as the reconciliation note"
      detail: "The root stays upstream's; the package keeps its history through git mv. Cost: links in the old README change."
    - key: B
      title: "Leave the package at the root"
      detail: "No move. Cost: the root presents unreviewed analysis as if it were the record."
  sources: ["assurance/README.md conventions"]
  status: assumed
  answer: {choice: A, via: assumed, at: 2026-10-21}
