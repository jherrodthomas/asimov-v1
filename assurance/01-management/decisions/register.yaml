- id: DQ-038
  ref: GAP-10
  question: "What is the tele-operation heartbeat timeout that triggers the safe stop: 250 ms as the concept-phase package proposed, or 100 ms?"
  context: >-
    SF-08 stops the robot when the operator's heartbeat stops arriving; the stop ends in the controlled descent you
    chose (DQ-005 A). The package proposes 250 ms. A shorter timeout catches a frozen link sooner but trips on
    ordinary Wi-Fi jitter, so every trip is a descent onto the tether; a longer one lets the robot keep moving on
    stale commands. The number also sizes the fall-arrest budget: a fall that starts at the moment the link froze
    has the timeout plus the descent time before anything happens.
  reversibility: easy
  decider: lead
  blocks: "WP-C-04 SF-08 demand; WP-W-09 PAR-nn; WP-S-04 budget; WP-V-05 fault injection"
  gate: G2
  asked: 2026-10-21
  batch: 4
  proceed_after: 2026-11-04
  options:
    - key: A
      recommended: true
      title: "250 ms, with a one-sample grace for jitter and a measured link-loss statistic from the first sessions before any change"
      detail: "The package's value, kept until data exists. Cost: up to a quarter of a second of stale commands at demonstration speed, which the clamps bound."
    - key: B
      title: "100 ms"
      detail: "Tighter. Cost: Wi-Fi jitter of that order is common; frequent descents onto the tether would make testing impractical and the robot would be stopped more often than driven."
    - key: C
      title: "500 ms"
      detail: "Fewer nuisance stops. Cost: half a second of motion on stale commands; the fall-arrest budget grows by the same amount."
  sources: ["concept package 09_FSC SF-08", "WP-C-04 SF-08", "WP-S-04 §2", "DFMEA FM-10"]
  status: applied
  answer: {choice: A, via: inbox, at: 2026-10-21}
  applied: {ref: "asimov-v1 claude/happy-sagan-hl6agy", record: "WP-C-04 v0.5 SF-08 (250 ms with a one-sample grace; link-loss statistic from the first sessions before any change); WP-W-09 §2; WP-S-04 §2", at: 2026-10-21}

- id: DQ-039
  ref: GAP-11
  question: "In the laboratory, is a lost wireless E-stop heartbeat itself a stop demand, or only a warning while the wired pendant is in the operator's hand?"
  context: >-
    You keep the kit's wireless E-stop as a second device with heartbeat surveillance (DQ-008 A). Surveillance means
    the robot knows when the transmitter has gone quiet (dead battery, jammed link). If that counts as a stop demand,
    the robot descends onto the tether every time the observer's transmitter drops out, which may be often with a
    consumer radio; if it is only a warning, the wireless device is not a safety device in OE-1, only a convenience,
    and the wired pendant carries the function alone, which is what the risk assessment already assumes.
  reversibility: easy
  decider: lead
  blocks: "WP-C-04 SF-13 demand; WP-S-03 §4; WP-V-04 test cases; WP-V-07 §3 last row"
  gate: G2
  asked: 2026-10-21
  batch: 4
  proceed_after: 2026-11-04
  options:
    - key: A
      recommended: true
