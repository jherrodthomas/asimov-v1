<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="hero-t hero-d">
  <title id="hero-t">Asimov v1 assurance: An open humanoid. Engineered for safety.</title>
  <desc id="hero-d">Asimov v1 assurance banner: a geometric biped in amber hanging from a gantry on a cyan tether, with a camera head, a red emergency-stop pendant on a lead and a dashed fall radius on a perspective floor grid, beside the project name and the tagline An open humanoid. Engineered for safety. Chips name the standards: ISO 12100, ISO 10218, ISO 13482, ISO 13849-1, IEC 62443, Machinery Reg. (EU) 2023/1230.</desc>
