<text x="72" y="278" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="52" font-weight="800" fill="#D4821A" text-anchor="start" letter-spacing="-1">Engineered for safety.</text>
