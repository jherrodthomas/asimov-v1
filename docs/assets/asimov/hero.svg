<text x="72" y="345" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4E6A73" text-anchor="start">the Asimov v1 humanoid: robot risk assessment, a deterministic</text>
