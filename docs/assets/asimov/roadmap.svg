<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="road-t road-d">
  <title id="road-t">Asimov v1 assurance roadmap</title>
  <desc id="road-d">Roadmap. Phase 01, Foundation (Active): Governance and safety plan, Baseline gap assessment, Work product register, Integrated process model, Decision register. Phase 02, Safety Engineering (Active): Item definition and risk assessment, Safety functions and required PL, Safe state and fall-arrest concept, Cybersecurity threat assessment, Test operations hold point. Phase 03, Build and Verify (Planned): Gantry, wired E-stop, bench supply, Deterministic safety layer, Chain design and PL calculation, Fall, descent and contact tests, Fault injection. Phase 04, Validate and Release (Planned): Validation on the robot, Independent assessment, Technical documentation, Declaration of conformity draft, Field monitoring.</desc>
  <defs>
<linearGradient id="road-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F3F7F8"/></linearGradient>
<linearGradient id="road-amber" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A8650F"/><stop offset="0.5" stop-color="#F2A33A"/><stop offset="1" stop-color="#A8650F"/></linearGradient>
  </defs>
